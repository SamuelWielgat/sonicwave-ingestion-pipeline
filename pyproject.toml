[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sonicwave-ingestion"
version = "0.1.0"
description = "SonicWave ingestion pipeline — Bronze/Silver medallion over daily source drops"
requires-python = ">=3.10"
dependencies = [
    "pyspark>=3.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sonicwave_ingestion"]

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
